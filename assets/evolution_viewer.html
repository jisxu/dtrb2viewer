<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTRB2 数码兽进化路线查询</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <div id="sidebar">
        <h1>DTRB2 数码兽进化路线</h1>
        <div id="search-box">
            <input type="text" id="search-input" placeholder="搜索数码兽名称...">
        </div>
        <div id="filter-box">
            <button class="filter-btn active" data-stage="all">全部</button>
            <button class="filter-btn" data-stage="数码蛋">蛋</button>
            <button class="filter-btn" data-stage="幼年期I">幼年I</button>
            <button class="filter-btn" data-stage="幼年期II">幼年II</button>
            <button class="filter-btn" data-stage="成长期">成长期</button>
            <button class="filter-btn" data-stage="成熟期">成熟期</button>
            <button class="filter-btn" data-stage="完全体">完全体</button>
            <button class="filter-btn" data-stage="究极体">究极体</button>
            <button class="filter-btn" data-stage="超究极">超究极</button>
            <button class="filter-btn" data-stage="装甲体">装甲体</button>
            <button class="filter-btn" data-stage="无等级">无等级</button>
        </div>
        <div class="collect-filter-box">
            <button class="collect-filter-btn active" data-collect="all">全部</button>
            <button class="collect-filter-btn" data-collect="collected">已收录</button>
            <button class="collect-filter-btn" data-collect="uncollected">未收录</button>
        </div>
        <div id="digimon-list"></div>
    </div>
    <div id="main">
        <div id="network"></div>
        <div id="toolbar">
            <button class="tool-btn" onclick="resetView()">重置视图</button>
            <button class="tool-btn" onclick="showAll()">显示全部</button>
        </div>
        <div id="info-panel"></div>
        <div id="stats"></div>
    </div>
</div>

<template id="tpl-digimon-item">
    <div class="digimon-item" data-name="">
        <img class="thumb" src="" alt="" onerror="this.style.display='none'">
        <div class="thumb-placeholder">?</div>
        <div class="info">
            <span class="name"></span>
            <span class="stage-tag"></span>
        </div>
        <button class="collect-btn" title="标记收录"></button>
    </div>
</template>

<template id="tpl-evo-item">
    <div class="evo-item" data-name="">
        <img class="evo-thumb" src="" alt="" onerror="this.style.display='none'">
        <div class="evo-thumb-placeholder">?</div>
        <div class="evo-info">
            <div class="evo-name"></div>
            <div class="evo-cond"></div>
        </div>
    </div>
</template>

<template id="tpl-info-panel">
    <h3>
        <img class="avatar" src="" alt="" onerror="this.style.display='none'">
        <span class="info-title"></span>
    </h3>
    <div class="info-row"><span class="info-label">阶段:</span><span class="info-value"><span class="stage-tag"></span></span></div>
    <div class="info-row info-type" style="display:none"><span class="info-label">类型:</span><span class="info-value"></span></div>
    <div class="info-row info-element" style="display:none"><span class="info-label">元素:</span><span class="info-value"></span></div>
    <div class="info-row info-attribute" style="display:none"><span class="info-label">属性:</span><span class="info-value"></span></div>
    <div class="evo-section evo-from" style="display:none">
        <h4></h4>
        <div class="evo-list"></div>
    </div>
    <div class="evo-section evo-to" style="display:none">
        <h4></h4>
        <div class="evo-list"></div>
    </div>
</template>

<template id="tpl-stats">
    <div class="stat-row">
        <span class="stat-item"><span class="stat-dot" style="background:#4b5563"></span> <span class="stat-total"></span> 数码兽</span>
        <span class="stat-item"><span class="stat-dot" style="background:#10b981"></span> <span class="stat-collected"></span> 已收录</span>
        <span class="stat-item"><span class="stat-edges"></span> 条进化</span>
    </div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="stat-percent">图鉴完成度: <span></span></div>
</template>

<script src="app.js"></script>
</body>
</html>
