<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTRB2 数码兽进化路线查询</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: #0a0e17;
    color: #e0e0e0;
    overflow: hidden;
    height: 100vh;
}
#app {
    display: flex;
    height: 100vh;
}
#sidebar {
    width: 340px;
    min-width: 340px;
    background: #111827;
    border-right: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#sidebar h1 {
    font-size: 18px;
    padding: 16px;
    background: linear-gradient(135deg, #1e3a5f, #0f172a);
    text-align: center;
    color: #60a5fa;
    border-bottom: 1px solid #1e293b;
}
#search-box {
    padding: 12px;
    border-bottom: 1px solid #1e293b;
}
#search-box input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
}
#search-box input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
}
#search-box input::placeholder { color: #6b7280; }
#filter-box {
    padding: 8px 12px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.filter-btn {
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #9ca3af;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn:hover { border-color: #3b82f6; color: #60a5fa; }
.filter-btn.active { background: #1e40af; border-color: #3b82f6; color: #93c5fd; }
#digimon-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}
#digimon-list::-webkit-scrollbar { width: 6px; }
#digimon-list::-webkit-scrollbar-track { background: #111827; }
#digimon-list::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
.digimon-item {
    padding: 8px 12px;
    margin: 2px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.digimon-item:hover { background: #1e293b; }
.digimon-item.selected { background: #1e3a5f; border: 1px solid #3b82f6; }
.digimon-item.collected { border-left: 3px solid #10b981; }
.digimon-item .thumb {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: contain;
    background: #1f2937;
    flex-shrink: 0;
}
.digimon-item .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.digimon-item .name { font-size: 13px; }
.digimon-item .stage-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    align-self: flex-start;
}
.digimon-item .collect-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #374151;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #374151;
    transition: all 0.2s;
    flex-shrink: 0;
}
.digimon-item .collect-btn:hover { border-color: #10b981; color: #10b981; }
.digimon-item .collect-btn.collected {
    background: #10b981;
    border-color: #10b981;
    color: #fff;
}
#main { flex: 1; position: relative; }
#network { width: 100%; height: 100%; }
#info-panel {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 300px;
    background: #111827ee;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 16px;
    display: none;
    backdrop-filter: blur(10px);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
}
#info-panel::-webkit-scrollbar { width: 6px; }
#info-panel::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
#info-panel h3 {
    font-size: 16px;
    color: #60a5fa;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 12px;
}
#info-panel h3 .avatar {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: contain;
    background: #1f2937;
}
#info-panel .info-row {
    margin: 6px 0;
    font-size: 13px;
}
#info-panel .info-label {
    color: #9ca3af;
    display: inline-block;
    width: 55px;
}
#info-panel .info-value { color: #e0e0e0; }
#info-panel .evo-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #1e293b;
}
#info-panel .evo-section h4 {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 8px;
}
.evo-item {
    padding: 8px 10px;
    margin: 4px 0;
    background: #1f2937;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
}
.evo-item:hover { background: #374151; }
.evo-item .evo-thumb {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    object-fit: contain;
    background: #111827;
    flex-shrink: 0;
}
.evo-item .evo-info { flex: 1; }
.evo-item .evo-name { font-size: 12px; color: #e0e0e0; }
.evo-item .evo-cond { color: #fbbf24; font-size: 11px; margin-top: 2px; }
#toolbar {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 8px;
}
.tool-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #111827ee;
    color: #e0e0e0;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.15s;
}
.tool-btn:hover { background: #1e293b; border-color: #3b82f6; }
#stats {
    position: absolute;
    bottom: 12px;
    left: 12px;
    padding: 10px 14px;
    background: #111827ee;
    border: 1px solid #1e293b;
    border-radius: 8px;
    font-size: 12px;
    color: #6b7280;
    backdrop-filter: blur(10px);
    line-height: 1.6;
}
#stats .stat-row { display: flex; gap: 16px; }
#stats .stat-item { display: flex; align-items: center; gap: 4px; }
#stats .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}
#stats .progress-bar {
    width: 100px;
    height: 6px;
    background: #1f2937;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
}
#stats .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 3px;
    transition: width 0.3s;
}
.collect-filter-box {
    padding: 4px 12px 8px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    gap: 6px;
}
.collect-filter-btn {
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #9ca3af;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
}
.collect-filter-btn:hover { border-color: #10b981; color: #10b981; }
.collect-filter-btn.active { background: #065f46; border-color: #10b981; color: #6ee7b7; }
.stage-数码蛋 { background: #a3a3a322; color: #d4d4d4; border: 1px solid #a3a3a355; }
.stage-幼年期I { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed55; }
.stage-幼年期II { background: #8b5cf622; color: #c4b5fd; border: 1px solid #8b5cf655; }
.stage-成长期 { background: #10b98122; color: #6ee7b7; border: 1px solid #10b98155; }
.stage-成熟期 { background: #3b82f622; color: #93c5fd; border: 1px solid #3b82f655; }
.stage-完全体 { background: #f59e0b22; color: #fcd34d; border: 1px solid #f59e0b55; }
.stage-究极体 { background: #ef444422; color: #fca5a5; border: 1px solid #ef444455; }
.stage-超究极 { background: #ec489922; color: #f9a8d4; border: 1px solid #ec489955; }
.stage-装甲体 { background: #06b6d422; color: #67e8f9; border: 1px solid #06b6d455; }
.stage-无等级 { background: #6b728022; color: #d1d5db; border: 1px solid #6b728055; }
</style>
</head>
<body>
<div id="app">
    <div id="sidebar">
        <h1>DTRB2 数码兽进化路线</h1>
        <div id="search-box">
            <input type="text" id="search-input" placeholder="搜索数码兽名称...">
        </div>
        <div id="filter-box">
            <button class="filter-btn active" data-stage="all">全部</button>
            <button class="filter-btn" data-stage="数码蛋">蛋</button>
            <button class="filter-btn" data-stage="幼年期I">幼年I</button>
            <button class="filter-btn" data-stage="幼年期II">幼年II</button>
            <button class="filter-btn" data-stage="成长期">成长期</button>
            <button class="filter-btn" data-stage="成熟期">成熟期</button>
            <button class="filter-btn" data-stage="完全体">完全体</button>
            <button class="filter-btn" data-stage="究极体">究极体</button>
            <button class="filter-btn" data-stage="超究极">超究极</button>
            <button class="filter-btn" data-stage="装甲体">装甲体</button>
            <button class="filter-btn" data-stage="无等级">无等级</button>
        </div>
        <div class="collect-filter-box">
            <button class="collect-filter-btn active" data-collect="all">全部</button>
            <button class="collect-filter-btn" data-collect="collected">已收录</button>
            <button class="collect-filter-btn" data-collect="uncollected">未收录</button>
        </div>
        <div id="digimon-list"></div>
    </div>
    <div id="main">
        <div id="network"></div>
        <div id="toolbar">
            <button class="tool-btn" onclick="resetView()">重置视图</button>
            <button class="tool-btn" onclick="showAll()">显示全部</button>
        </div>
        <div id="info-panel"></div>
        <div id="stats"></div>
    </div>
</div>

<script>
let allNodes = [];
let allEdges = [];
let nodeMap = {};
let imageMap = {};
let network = null;
let visNodes = null;
let visEdges = null;
let selectedNode = null;
let currentFilter = 'all';
let currentCollectFilter = 'all';
let collectedSet = new Set();

const stageColors = {
    '数码蛋':    { bg: '#a3a3a3', border: '#d4d4d4', highlight: { bg: '#d4d4d4', border: '#e5e5e5' } },
    '幼年期I':   { bg: '#7c3aed', border: '#a78bfa', highlight: { bg: '#8b5cf6', border: '#c4b5fd' } },
    '幼年期II':  { bg: '#8b5cf6', border: '#c4b5fd', highlight: { bg: '#a78bfa', border: '#ddd6fe' } },
    '成长期':    { bg: '#10b981', border: '#6ee7b7', highlight: { bg: '#34d399', border: '#a7f3d0' } },
    '成熟期':    { bg: '#3b82f6', border: '#93c5fd', highlight: { bg: '#60a5fa', border: '#bfdbfe' } },
    '完全体':    { bg: '#f59e0b', border: '#fcd34d', highlight: { bg: '#fbbf24', border: '#fde68a' } },
    '究极体':    { bg: '#ef4444', border: '#fca5a5', highlight: { bg: '#f87171', border: '#fecaca' } },
    '超究极':    { bg: '#ec4899', border: '#f9a8d4', highlight: { bg: '#f472b6', border: '#fbcfe8' } },
    '装甲体':    { bg: '#06b6d4', border: '#67e8f9', highlight: { bg: '#22d3ee', border: '#a5f3fc' } },
    '无等级':    { bg: '#6b7280', border: '#d1d5db', highlight: { bg: '#9ca3af', border: '#e5e7eb' } },
    '':          { bg: '#4b5563', border: '#9ca3af', highlight: { bg: '#6b7280', border: '#d1d5db' } }
};

const stageOrder = ['数码蛋', '幼年期I', '幼年期II', '成长期', '成熟期', '完全体', '究极体', '超究极', '装甲体', '无等级', ''];

function getStageColor(stage) {
    return stageColors[stage] || stageColors[''];
}

function getNodeSize(stage) {
    const sizes = {
        '数码蛋': 16, '幼年期I': 20, '幼年期II': 24, '成长期': 30,
        '成熟期': 36, '完全体': 42, '究极体': 48,
        '超究极': 54, '装甲体': 34, '无等级': 30, '': 26
    };
    return sizes[stage] || 26;
}

function getImagePath(name) {
    return imageMap[name] ? 'images/' + imageMap[name] : null;
}

async function loadData() {
    const [evoResp, imgResp] = await Promise.all([
        fetch('evolution_data.json'),
        fetch('images/image_map.json')
    ]);
    const evoData = await evoResp.json();
    imageMap = await imgResp.json();

    allNodes = evoData.nodes;
    allEdges = evoData.edges;
    allNodes.forEach(n => { nodeMap[n.name] = n; });

    // 加载收录数据
    loadCollection();

    renderList();
    initNetwork();
    updateStats();
}

function loadCollection() {
    try {
        const saved = localStorage.getItem('dtrb2_collection');
        if (saved) {
            const arr = JSON.parse(saved);
            collectedSet = new Set(arr);
        }
    } catch (e) {
        collectedSet = new Set();
    }
}

function saveCollection() {
    try {
        localStorage.setItem('dtrb2_collection', JSON.stringify([...collectedSet]));
    } catch (e) {}
}

function toggleCollection(name, event) {
    if (event) event.stopPropagation();
    if (collectedSet.has(name)) {
        collectedSet.delete(name);
    } else {
        collectedSet.add(name);
    }
    saveCollection();
    renderList();
    updateStats();
}

function isCollected(name) {
    return collectedSet.has(name);
}

function renderList() {
    const container = document.getElementById('digimon-list');
    const search = document.getElementById('search-input').value.toLowerCase();

    let filtered = allNodes.filter(n => {
        if (currentFilter !== 'all' && n.stage !== currentFilter) return false;
        if (search && !n.name.toLowerCase().includes(search)) return false;
        if (currentCollectFilter === 'collected' && !isCollected(n.name)) return false;
        if (currentCollectFilter === 'uncollected' && isCollected(n.name)) return false;
        return true;
    });

    filtered.sort((a, b) => {
        const sa = stageOrder.indexOf(a.stage);
        const sb = stageOrder.indexOf(b.stage);
        if (sa !== sb) return sa - sb;
        return a.name.localeCompare(b.name);
    });

    container.innerHTML = filtered.map(n => {
        const sel = selectedNode === n.name ? ' selected' : '';
        const collected = isCollected(n.name);
        const collectedClass = collected ? ' collected' : '';
        const imgPath = getImagePath(n.name);
        const imgHtml = imgPath
            ? `<img class="thumb" src="${imgPath}" alt="${n.name}" onerror="this.style.display='none'">`
            : `<div class="thumb" style="background:#1f2937;display:flex;align-items:center;justify-content:center;font-size:10px;color:#4b5563">?</div>`;
        return `<div class="digimon-item${sel}${collectedClass}" onclick="selectDigimon('${n.name.replace(/'/g, "\\'")}')">
            ${imgHtml}
            <div class="info">
                <span class="name">${n.name}</span>
                <span class="stage-tag stage-${n.stage}">${n.stage || '未知'}</span>
            </div>
            <button class="collect-btn${collected ? ' collected' : ''}" onclick="toggleCollection('${n.name.replace(/'/g, "\\'")}', event)" title="${collected ? '取消收录' : '标记收录'}">
                ${collected ? '✓' : ''}
            </button>
        </div>`;
    }).join('');
}

function initNetwork() {
    const container = document.getElementById('network');

    visNodes = new vis.DataSet(allNodes.map(n => {
        const sc = getStageColor(n.stage);
        const imgPath = getImagePath(n.name);
        const size = getNodeSize(n.stage);

        if (imgPath) {
            return {
                id: n.name,
                label: n.name,
                title: `${n.name}\n阶段: ${n.stage || '未知'}\n类型: ${n.type || '-'}\n元素: ${n.element || '-'}\n属性: ${n.attribute || '-'}`,
                shape: 'image',
                image: imgPath,
                size: size,
                font: { color: '#e0e0e0', size: 11, strokeWidth: 3, strokeColor: '#0a0e17' },
                color: { border: sc.border, highlight: { border: sc.border } },
                borderWidth: 2,
                brokenImage: null
            };
        }

        return {
            id: n.name,
            label: n.name,
            title: `${n.name}\n阶段: ${n.stage || '未知'}\n类型: ${n.type || '-'}\n元素: ${n.element || '-'}\n属性: ${n.attribute || '-'}`,
            color: { background: sc.bg, border: sc.border, highlight: sc.highlight },
            font: { color: '#e0e0e0', size: 11, strokeWidth: 3, strokeColor: '#0a0e17' },
            size: size,
            shape: 'dot',
            borderWidth: 2
        };
    }));

    visEdges = new vis.DataSet(allEdges.map((e, i) => ({
        id: i,
        from: e.from,
        to: e.to,
        title: e.condition,
        arrows: 'to',
        color: { color: '#4b5563', highlight: '#3b82f6', opacity: 0.6 },
        width: 1,
        smooth: { type: 'continuous' }
    })));

    const options = {
        physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            forceAtlas2Based: {
                gravitationalConstant: -120,
                centralGravity: 0.008,
                springLength: 150,
                springConstant: 0.03,
                damping: 0.55
            },
            stabilization: { iterations: 300 }
        },
        interaction: {
            hover: true,
            tooltipDelay: 100,
            zoomView: true,
            dragView: true,
            multiselect: true
        },
        nodes: {
            font: { face: 'Microsoft YaHei' }
        },
        edges: {
            font: { size: 0 },
            smooth: { type: 'continuous' }
        }
    };

    network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);

    network.on('click', function(params) {
        if (params.nodes.length > 0) {
            selectDigimon(params.nodes[0]);
        } else {
            hideInfo();
        }
    });

    network.on('stabilizationIterationsDone', function() {
        network.setOptions({ physics: { enabled: false } });
    });
}

function selectDigimon(name) {
    selectedNode = name;
    renderList();

    const relatedNodes = new Set([name]);
    const relatedEdges = new Set();

    allEdges.forEach((e, i) => {
        if (e.from === name || e.to === name) {
            relatedNodes.add(e.from);
            relatedNodes.add(e.to);
            relatedEdges.add(i);
        }
    });

    const secondOrder = new Set(relatedNodes);
    allEdges.forEach((e, i) => {
        if (secondOrder.has(e.from) || secondOrder.has(e.to)) {
            relatedNodes.add(e.from);
            relatedNodes.add(e.to);
            relatedEdges.add(i);
        }
    });

    const updates = allNodes.map(n => {
        const sc = getStageColor(n.stage);
        const isRelated = relatedNodes.has(n.name);
        const isCenter = n.name === name;
        const imgPath = getImagePath(n.name);

        if (!isRelated) {
            return {
                id: n.name,
                opacity: 0.3,
                font: { color: '#555', size: 9 },
                fixed: { x: true, y: true }
            };
        }

        if (imgPath) {
            return {
                id: n.name,
                opacity: 1,
                size: isCenter ? getNodeSize(n.stage) * 1.6 : getNodeSize(n.stage),
                font: { color: '#fff', size: isCenter ? 14 : 11, strokeWidth: 3, strokeColor: '#0a0e17' },
                color: { border: isCenter ? '#60a5fa' : sc.border },
                fixed: { x: false, y: false }
            };
        }

        return {
            id: n.name,
            opacity: 1,
            size: isCenter ? getNodeSize(n.stage) * 1.6 : getNodeSize(n.stage),
            font: { color: '#fff', size: isCenter ? 14 : 11, strokeWidth: 3, strokeColor: '#0a0e17' },
            color: { background: sc.bg, border: isCenter ? '#60a5fa' : sc.border, highlight: sc.highlight },
            fixed: { x: false, y: false }
        };
    });
    visNodes.update(updates);

    const edgeUpdates = allEdges.map((e, i) => ({
        id: i,
        color: relatedEdges.has(i) ? { color: '#60a5fa', highlight: '#93c5fd', opacity: 0.8 } : { color: '#1a1a2e', opacity: 0.03 },
        width: relatedEdges.has(i) ? 2.5 : 0.3
    }));
    visEdges.update(edgeUpdates);

    network.focus(name, { scale: 1.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    showInfo(name);
}

function showInfo(name) {
    const node = nodeMap[name];
    if (!node) return;

    const evolvesFrom = [];
    const evolvesTo = [];

    allEdges.forEach(e => {
        if (e.to === name) evolvesFrom.push(e);
        if (e.from === name) evolvesTo.push(e);
    });

    const panel = document.getElementById('info-panel');
    panel.style.display = 'block';

    const imgPath = getImagePath(name);
    const imgHtml = imgPath
        ? `<img class="avatar" src="${imgPath}" alt="${name}" onerror="this.style.display='none'">`
        : '';

    let html = `<h3>${imgHtml}<span>${name}</span></h3>`;
    html += `<div class="info-row"><span class="info-label">阶段:</span><span class="info-value"><span class="stage-tag stage-${node.stage}">${node.stage || '未知'}</span></span></div>`;
    if (node.type) html += `<div class="info-row"><span class="info-label">类型:</span><span class="info-value">${node.type}</span></div>`;
    if (node.element) html += `<div class="info-row"><span class="info-label">元素:</span><span class="info-value">${node.element}</span></div>`;
    if (node.attribute) html += `<div class="info-row"><span class="info-label">属性:</span><span class="info-value">${node.attribute}</span></div>`;

    if (evolvesFrom.length > 0) {
        html += `<div class="evo-section"><h4>进化来源 (${evolvesFrom.length})</h4>`;
        evolvesFrom.forEach(e => {
            const eImg = getImagePath(e.from);
            const eImgHtml = eImg
                ? `<img class="evo-thumb" src="${eImg}" alt="${e.from}" onerror="this.style.display='none'">`
                : `<div class="evo-thumb" style="display:flex;align-items:center;justify-content:center;font-size:9px;color:#4b5563">?</div>`;
            html += `<div class="evo-item" onclick="selectDigimon('${e.from.replace(/'/g, "\\'")}')">
                ${eImgHtml}
                <div class="evo-info">
                    <div class="evo-name">${e.from}</div>
                    <div class="evo-cond">${e.condition}</div>
                </div>
            </div>`;
        });
        html += '</div>';
    }

    if (evolvesTo.length > 0) {
        html += `<div class="evo-section"><h4>可进化为 (${evolvesTo.length})</h4>`;
        evolvesTo.forEach(e => {
            const eImg = getImagePath(e.to);
            const eImgHtml = eImg
                ? `<img class="evo-thumb" src="${eImg}" alt="${e.to}" onerror="this.style.display='none'">`
                : `<div class="evo-thumb" style="display:flex;align-items:center;justify-content:center;font-size:9px;color:#4b5563">?</div>`;
            html += `<div class="evo-item" onclick="selectDigimon('${e.to.replace(/'/g, "\\'")}')">
                ${eImgHtml}
                <div class="evo-info">
                    <div class="evo-name">${e.to}</div>
                    <div class="evo-cond">${e.condition}</div>
                </div>
            </div>`;
        });
        html += '</div>';
    }

    panel.innerHTML = html;
}

function hideInfo() {
    document.getElementById('info-panel').style.display = 'none';
    selectedNode = null;
    renderList();
    resetNodeStyles();
}

function resetNodeStyles() {
    const updates = allNodes.map(n => {
        const sc = getStageColor(n.stage);
        const imgPath = getImagePath(n.name);

        if (imgPath) {
            return {
                id: n.name,
                opacity: 1,
                size: getNodeSize(n.stage),
                font: { color: '#e0e0e0', size: 11, strokeWidth: 3, strokeColor: '#0a0e17' },
                color: { border: sc.border },
                fixed: { x: false, y: false }
            };
        }

        return {
            id: n.name,
            opacity: 1,
            size: getNodeSize(n.stage),
            font: { color: '#e0e0e0', size: 11, strokeWidth: 3, strokeColor: '#0a0e17' },
            color: { background: sc.bg, border: sc.border, highlight: sc.highlight },
            fixed: { x: false, y: false }
        };
    });
    visNodes.update(updates);

    const edgeUpdates = allEdges.map((e, i) => ({
        id: i,
        color: { color: '#4b5563', highlight: '#3b82f6', opacity: 0.6 },
        width: 1
    }));
    visEdges.update(edgeUpdates);
}

function resetView() {
    network.fit({ animation: true });
    hideInfo();
}

function showAll() {
    hideInfo();
    network.fit({ animation: true });
}

function updateStats() {
    const total = allNodes.length;
    const collected = collectedSet.size;
    const percent = total > 0 ? Math.round((collected / total) * 100) : 0;

    let html = `<div class="stat-row">
        <span class="stat-item"><span class="stat-dot" style="background:#4b5563"></span> ${total} 数码兽</span>
        <span class="stat-item"><span class="stat-dot" style="background:#10b981"></span> ${collected} 已收录</span>
        <span class="stat-item">${allEdges.length} 条进化</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
    <div>图鉴完成度: ${percent}%</div>`;
    document.getElementById('stats').innerHTML = html;
}

document.getElementById('search-input').addEventListener('input', renderList);

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.stage;
        renderList();
    });
});

document.querySelectorAll('.collect-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.collect-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCollectFilter = btn.dataset.collect;
        renderList();
    });
});

loadData();
</script>
</body>
</html>
